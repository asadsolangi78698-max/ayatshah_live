name: ayatshah_live
description: AyatShah Live - Live Streaming, Audio Party & PK Battle Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Firebase (Push Notifications)
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.3

  # Live Streaming SDK (choose one; Agora shown as default)
  agora_rtc_engine: ^6.3.2

  # Auth Providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  intl: ^0.19.0
  logger: ^2.3.0
  uuid: ^4.4.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2

  # Payments
  in_app_purchase: ^3.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  # NOTE: Poppins is loaded at runtime via the `google_fonts` package
  # (see lib/core/theme/app_theme.dart -> GoogleFonts.poppinsTextTheme).
  # No local font asset files are bundled, so there is no `fonts:` block
  # here — declaring one without the matching .ttf files in assets/fonts/
  # breaks `flutter pub get` / build with a missing-asset error.
